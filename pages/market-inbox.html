<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swapspot · Seller inbox</title>
<style>
  :root { --bg:#f0f2f5; --card:#fff; --ink:#1c1e21; --muted:#65676b; --line:#dddfe2; --blue:#1877f2; --bubble:#e4e6eb; --err:#b42318; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; align-items:center; gap:10px; }
  header b { color:var(--blue); font-size:1.1rem; }
  main { flex:1; min-height:0; display:grid; grid-template-columns:280px 1fr; }
  nav { background:var(--card); border-right:1px solid var(--line); overflow:auto; }
  nav h2 { margin:0; padding:12px 14px; font-size:1rem; }
  nav ul { list-style:none; margin:0; padding:0; }
  nav button { width:100%; text-align:left; border:0; background:transparent; padding:10px 14px; cursor:pointer; font:inherit; color:inherit; border-bottom:1px solid var(--line); }
  nav button[aria-current="true"] { background:#e7f0ff; }
  nav button[data-unread]:not([data-unread="0"]) strong::after { content:" ●"; color:var(--blue); }
  nav small { color:var(--muted); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  section { display:flex; flex-direction:column; min-height:0; background:var(--card); }
  #who { margin:0; padding:12px 16px; border-bottom:1px solid var(--line); font-size:1rem; }
  #conversation { flex:1; overflow:auto; padding:14px 16px; display:flex; flex-direction:column; gap:6px; }
  .msg { max-width:70%; padding:8px 12px; border-radius:18px; background:var(--bubble); word-wrap:break-word; }
  .msg.seller { align-self:flex-end; background:var(--blue); color:#fff; }
  .msg.seller.auto { background:#6b7280; }
  .msg small { display:block; opacity:.7; font-size:.72rem; }
  form { border-top:1px solid var(--line); padding:10px 16px; display:grid; grid-template-columns:1fr auto; gap:8px; }
  label { position:absolute; left:-9999px; }
  textarea { font:inherit; border:1px solid var(--line); border-radius:12px; padding:8px 12px; resize:none; height:52px; }
  #send { font:inherit; border:0; border-radius:12px; background:var(--blue); color:#fff; padding:0 20px; cursor:pointer; }
  #send:disabled { opacity:.5; cursor:not-allowed; }
  #error { grid-column:1/-1; color:var(--err); font-size:.9rem; }
  #error[hidden] { display:none; }
  .empty { color:var(--muted); padding:20px; }
</style>
</head>
<body>
<header><b>swapspot</b><span>Seller inbox</span><span id="status" style="margin-left:auto;color:var(--muted)"></span></header>
<main>
  <nav aria-label="Conversations"><h2>Chats</h2><ul id="threads"></ul></nav>
  <section aria-label="Conversation">
    <h2 id="who">Select a chat</h2>
    <div id="conversation" role="log" aria-live="polite"><div class="empty">No chat selected.</div></div>
    <form id="composer-form" onsubmit="return false">
      <label for="composer">Message</label>
      <textarea id="composer" placeholder="Write a message…" maxlength="280" disabled></textarea>
      <button id="send" type="button" disabled>Send</button>
      <div id="error" role="alert" hidden></div>
    </form>
  </section>
</main>
<script>
(() => {
  const $ = (s) => document.getElementById(s);
  const key = new URLSearchParams(location.search).get('key') || '';
  const H = { 'x-market-key': key, 'content-type': 'application/json' };
  let selected = (location.hash || '').slice(1) || null;
  let lastRender = '';

  const api = async (path, opts) => {
    const r = await fetch('/api/market/seller' + path, Object.assign({ headers: H }, opts));
    let body = null; try { body = await r.json(); } catch {}
    return { status: r.status, body };
  };

  function paintThreads(list) {
    const ul = $('threads'); ul.replaceChildren();
    list.forEach((t) => {
      const li = document.createElement('li'); const b = document.createElement('button');
      b.dataset.thread = t.id; b.dataset.unread = String(t.unread); b.setAttribute('aria-current', String(t.id === selected));
      const n = document.createElement('strong'); n.textContent = t.name + (t.unread ? ' (' + t.unread + ' new)' : '');
      const s = document.createElement('small'); s.textContent = (t.last_from === 'seller' ? 'You: ' : '') + t.last_text;
      b.append(n, s); b.onclick = () => select(t.id); li.append(b); ul.append(li);
    });
  }

  function paintConversation(t) {
    const sig = JSON.stringify(t.messages.map((m) => [m.from, m.text]));
    $('who').textContent = t.name;
    $('composer').disabled = false; $('send').disabled = false;
    if (sig === lastRender) return; lastRender = sig;
    const box = $('conversation'); box.replaceChildren();
    t.messages.forEach((m) => {
      const d = document.createElement('div'); d.className = 'msg ' + m.from + (m.kind === 'auto' ? ' auto' : ''); d.dataset.from = m.from;
      d.textContent = m.text;
      if (m.from === 'seller' && m.kind === 'auto') { const s = document.createElement('small'); s.textContent = 'automatic reply'; d.append(s); }
      box.append(d);
    });
    box.scrollTop = box.scrollHeight;
  }

  async function select(id) {
    selected = id; location.hash = id; lastRender = ''; $('error').hidden = true; await refresh();
  }

  async function refresh() {
    const l = await api('/threads');
    if (l.status === 401) { $('status').textContent = 'Wrong or missing key'; return; }
    if (l.body) { paintThreads(l.body.threads); $('status').textContent = l.body.threads.length + ' chats'; }
    if (selected) { const c = await api('/threads/' + selected); if (c.status === 200) paintConversation(c.body.thread); }
  }

  $('send').onclick = async () => {
    const text = $('composer').value.trim(); if (!text || !selected) return;
    $('send').disabled = true; $('error').hidden = true;
    const r = await api('/threads/' + selected + '/send', { method: 'POST', body: JSON.stringify({ text }) });
    if (r.status === 200) { $('composer').value = ''; lastRender = ''; await refresh(); }
    else { $('error').textContent = 'Message blocked: ' + ((r.body && r.body.error) || 'could not send'); $('error').hidden = false; }
    $('send').disabled = false;
  };
  window.addEventListener('hashchange', () => { selected = (location.hash || '').slice(1) || null; lastRender = ''; refresh(); });
  window.__refresh = refresh; // lets the browser helper force a fresh read
  refresh(); setInterval(refresh, 1200);
})();
</script>
</body>
</html>
